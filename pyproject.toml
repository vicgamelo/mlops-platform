[project]
name = "mlops-platform"
version = "0.1.0"
description = "Credit risk MLOps on MLflow: training with lineage, gated champion/challenger promotion, drift monitoring and hot-swapping model serving."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Victor Gabriel Andrade de Melo", email = "victor.845.melo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.120",
    "mlflow>=3.18",
    "pandas>=3.1",
    "pydantic>=2.9",
    "scikit-learn>=1.9",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
mlops = "mlops_platform.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning:mlflow.*", "ignore::FutureWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
packages = ["mlops_platform"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
