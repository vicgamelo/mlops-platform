name: Retrain

# Train a challenger against the production MLflow and run the promotion gate.
# Manual only. Needs the MLFLOW_TRACKING_URI / MLFLOW_TRACKING_USERNAME /
# MLFLOW_TRACKING_PASSWORD secrets.
on:
  workflow_dispatch:
    inputs:
      promote:
        description: "Run the promotion gate after training"
        type: boolean
        default: true

jobs:
  retrain:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run mlops drift
      - id: train
        run: echo "version=$(uv run mlops train | jq -r .version)" >> "$GITHUB_OUTPUT"
      - if: inputs.promote
        run: uv run mlops promote --version ${{ steps.train.outputs.version }}
